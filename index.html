<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap me 🌻</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --accent: #f4a300;
    --text: #3a2e1f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #221a10;
      --card: #2d2313;
      --accent: #ffcb47;
      --text: #fff3d9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #221a10;
    --card: #2d2313;
    --accent: #ffcb47;
    --text: #fff3d9;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 20px env(safe-area-inset-bottom, 0px);
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 48px 32px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  }
  button {
    font-size: 1.2rem;
    font-weight: 600;
    padding: 16px 28px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #2a1e00;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:active { transform: scale(0.95); }
  #message {
    margin-top: 24px;
    font-size: 1.4rem;
    font-weight: 700;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #message.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>
  <div class="card">
    <button id="tapBtn">Tap me 🌻</button>
    <div id="message"></div>
  </div>
  <script>
    document.getElementById('tapBtn').addEventListener('click', function () {
      const el = document.getElementById('message');
      el.textContent = "You are the prettiest 🌻";
      el.classList.add('show');
    });
  </script>
</body>
</html>
